{% extends "base.html" %}
{% block title %}Connexion administration — CELINA-STORE{% endblock %}
{% block content %}
<section class="login-card"><p class="eyebrow">ACCÈS SÉCURISÉ</p><h1>Administration</h1><p>Connectez-vous pour gérer votre boutique.</p>
  <form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Identifiant<input name="username" autocomplete="username" required autofocus></label>
    <label>Mot de passe<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="button full-width">Se connecter</button>
  </form>
</section>
{% endblock %}
